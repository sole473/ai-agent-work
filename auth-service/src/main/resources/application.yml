server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:music}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:music}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
music:
  session:
    secure: ${SESSION_COOKIE_SECURE:true}
    ttl-hours: ${SESSION_TTL_HOURS:168}
