<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历工作台</title><link rel="stylesheet" href="/assets/style.css"><script defer src="/assets/resume.js"></script></head><body><header><strong>简历工作台</strong><a href="/">返回工作台选择</a></header><main><h1>用真实经历匹配岗位</h1><p>上传简历或经历材料。系统检索相关内容后，再让模型分析，不会凭空补造经历。</p><div class="workspace" style="margin-top:1.5rem"><section><h2>个人材料库</h2><form id="upload"><label>添加材料（PDF、DOCX、TXT、MD）<input name="file" type="file" accept=".pdf,.docx,.txt,.md" required></label><button>上传并索引</button><p id="upload-status" role="status"></p></form><h2 style="margin-top:1.5rem">已添加材料</h2><ul id="documents"></ul></section><section><h2>岗位匹配分析</h2><form id="match"><label>粘贴岗位描述<textarea name="job_description" rows="10" minlength="30" maxlength="12000" required placeholder="粘贴招聘要求与岗位职责"></textarea></label><button>检索材料并分析</button><p id="match-status" role="status"></p></form><article id="analysis"></article></section></div></main></body></html>
